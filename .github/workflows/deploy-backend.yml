name: Backend Docker Deploy

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "backend/Dockerfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Load variables
        id: vars
        run: |
          environment=${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

          if [ "$environment" = "prod" ]; then
            port="3200"
          else
            port="3201"
          fi

          dockerName="my-person-site-backend-${environment}"
          version=$(node -p "require('./backend/package.json').version")
          date=$(date +'%Y%m%d_%H%M%S')
          tag="${environment}-${version}-${date}"
          image="${{ secrets.DOCKER_NAME }}/${dockerName}"

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "environment=${environment}" >> "$GITHUB_OUTPUT"
          echo "port=${port}" >> "$GITHUB_OUTPUT"
          echo "dockerName=${dockerName}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_NAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        env:
          DOCKER_IMAGE: ${{ steps.vars.outputs.image }}
          DOCKER_TAG: ${{ steps.vars.outputs.tag }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}

      - name: Deploy to Server
        env:
          dockerName: ${{ steps.vars.outputs.dockerName }}
          image: ${{ steps.vars.outputs.image }}
          tag: ${{ steps.vars.outputs.tag }}
          port: ${{ steps.vars.outputs.port }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER_NAME }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            docker pull ${{ env.image }}:${{ env.tag }}
            docker stop ${{ env.dockerName }} || true
            docker rm ${{ env.dockerName }} || true
            docker run -d --name ${{ env.dockerName }} \
              --restart unless-stopped \
              -p ${{ env.port }}:${{ env.port }} \
              -e NODE_ENV=production \
              -e PORT=${{ env.port }} \
              ${{ env.image }}:${{ env.tag }}
